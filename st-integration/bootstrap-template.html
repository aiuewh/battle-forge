
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Battle Forge Panel</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  .bfp { color-scheme: dark; font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; max-width: 100%; padding: 8px; border-radius: 12px;
    background: linear-gradient(165deg, rgba(46,36,24,.97), rgba(24,18,12,.99));
    border: 1px solid rgba(216,178,122,.30); box-shadow: 0 6px 24px rgba(0,0,0,.45); color: #efe6d6; }
  .bfp * { box-sizing: border-box; }
  .bfp-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .bfp-title { font-weight: 800; font-size: 13px; color: #f0c289; letter-spacing: .06em; }
  .bfp-badge { font-size: 10.5px; color: #a89478; border: 1px solid rgba(216,178,122,.3); border-radius: 999px; padding: 1px 8px; }
  .bfp-list { display: flex; flex-direction: column; gap: 4px; }
  .bfp-row { display: flex; align-items: center; gap: 8px; padding: 4px 8px; border-radius: 8px; border: 1px solid rgba(216,178,122,.16); background: rgba(0,0,0,.28); }
  .bfp-row.next { border-color: rgba(240,194,137,.75); box-shadow: 0 0 14px rgba(240,194,137,.22); }
  .bfp-init { min-width: 24px; text-align: center; font-weight: 800; font-size: 13px; }
  .bfp-name { font-size: 12.5px; font-weight: 700; }
  .bfp-hpwrap { flex: 1; min-width: 60px; display: flex; align-items: center; gap: 6px; }
  .bfp-hptrack { flex: 1; height: 7px; border-radius: 999px; background: rgba(0,0,0,.55); overflow: hidden; border: 1px solid rgba(216,178,122,.15); }
  .bfp-hpfill { height: 100%; border-radius: 999px; }
  .bfp-hptext { font-size: 10.5px; color: #a89478; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .bfp-status { font-size: 10.5px; }
  .bfp-load { font-size: 11px; color: #a89478; padding: 4px 8px 0; }
  .bfp-load a { color: #d7a36b; }
  .bfp-warn { font-size: 11px; color: #ff9c8a; background: rgba(120,20,10,.35); border: 1px solid rgba(255,120,90,.4); border-radius: 8px; padding: 6px 8px; margin-bottom: 6px; }
  .bfp-brief { font-size: 11.5px; color: #f0c9c9; border: 1px solid rgba(255,120,90,.28); background: rgba(60,15,10,.35); border-radius: 8px; padding: 6px 8px; }
  .bfp-brief b { color: #ffb59e; }
  .bfp-cfg { display: none; margin: 6px 0; padding: 6px 8px; border-radius: 8px; border: 1px dashed rgba(216,178,122,.35); background: rgba(0,0,0,.3); }
  .bfp-cfg input { flex: 1; min-width: 120px; background: rgba(0,0,0,.5); border: 1px solid rgba(216,178,122,.3); border-radius: 6px; color: #efe6d6; padding: 3px 8px; font-size: 11px; }
  .bfp-cfg button { background: #8a6a3d; color: #fff; border: 0; border-radius: 6px; padding: 4px 10px; font-size: 11px; cursor: pointer; margin-left: 6px; }
  .bfp-gear { margin-left: auto; cursor: pointer; font-size: 11px; color: #a89478; border: 1px solid rgba(216,178,122,.25); border-radius: 6px; padding: 1px 7px; background: transparent; }
  .bfp-gear:hover { color: #f0c289; border-color: rgba(216,178,122,.5); }
  #bp-frame { width: 100%; border: 0; display: none; border-radius: 12px; }
</style>
</head>
<body>
<div class="bfp" id="bp-root">
  <div class="bfp-head">
    <span class="bfp-title">⚔ Battle Forge 战斗面板</span>
    <span class="bfp-badge" id="bp-badge">加载中…</span>
    <button class="bfp-gear" id="bp-gear" title="配置完整引擎地址">⚙ 应用地址</button>
  </div>
  <div class="bfp-cfg" id="bp-cfg">
    <div style="display:flex;align-items:center;gap:0">
      <input id="bp-cfg-input" type="text" placeholder="https://你的用户名.github.io/仓库名/" />
      <button id="bp-cfg-save">保存并重载</button>
    </div>
    <div style="font-size:10px;color:#a89478;margin-top:4px">部署 GitHub Pages 后把地址填在这里（保存在本浏览器，无需再改正则脚本）</div>
  </div>
  <div class="bfp-warn" id="bp-warn" style="display:none"></div>
  <div class="bfp-list" id="bp-fallback"></div>
  <div class="bfp-load" id="bp-hint">正在连接完整战斗引擎… 若长时间无响应将使用轻量模式</div>
  <iframe id="bp-frame" title="Battle Forge" allow="clipboard-write"></iframe>
</div>

<script type="text/plain" id="bp-data">$1</script>

<script>
try {
(function () {
  "use strict";
  var APP_URL_DEFAULT = "{{APP_URL}}"; // ← 部署后亦可在上方 ⚙ 中配置（localStorage 持久，优先级更高）
  var TIMEOUT_MS = 6000;
  var LS_KEY = "bf_app_url";

  function escHtml(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;")
      .replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  var dataEl = document.getElementById("bp-data");
  var raw = (dataEl ? dataEl.textContent : "") || "";
  var fallback = document.getElementById("bp-fallback");
  var badge = document.getElementById("bp-badge");
  var hint = document.getElementById("bp-hint");
  var frame = document.getElementById("bp-frame");
  var warnEl = document.getElementById("bp-warn");

  // ---- 应用地址：localStorage 覆盖 > 模板常量 ----
  var APP_URL = "";
  try { APP_URL = localStorage.getItem(LS_KEY) || APP_URL_DEFAULT; } catch (e) { APP_URL = APP_URL_DEFAULT; }
  function isPlaceholder(u) { return !u || u.indexOf("{{") !== -1 || u.indexOf("YOUR-NAME") !== -1; }

  // ---- 楼层深度探测（多面板领导者选举用；沙箱限制下静默失败 → null） ----
  function detectDepth() {
    try {
      var el = window.frameElement;
      if (!el || !el.ownerDocument) return null;
      var doc = el.ownerDocument;
      var mes = el.closest ? el.closest(".mes") : null;
      if (!mes || !mes.parentElement) return null;
      var sibs = mes.parentElement.children;
      var mine = -1, count = 0, after = 0;
      for (var i = 0; i < sibs.length; i++) {
        if (sibs[i].classList && sibs[i].classList.contains("mes")) {
          if (sibs[i] === mes) { mine = count; }
          count++;
        }
      }
      if (mine < 0) return null;
      after = count - 1 - mine; // 本楼之后（更新）的消息数 = 深度
      return Math.max(0, after);
    } catch (e) { return null; }
  }
  var DEPTH = detectDepth();

  var ATT_COLORS = { "0": "#4ea8de", "1": "#d9c47a", "2": "#e05252" };
  var STATUS_ICON = {
    blinded: "🚫", charmed: "💗", deafened: "🔇", frightened: "😱", grappled: "🤼",
    incapacitated: "💤", invisible: "👻", paralyzed: "⚡", petrified: "🗿", poisoned: "🤢",
    prone: "🛌", restrained: "🪢", stunned: "💫", unconscious: "😵"
  };

  // ---- 轻量解析（离线降级用） ----
  function parseUnits(text) {
    var units = [];
    var lines = text.split(/\r?\n/);
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i].trim();
      if (!line || line.indexOf("|") === -1) continue;
      var parts = line.split("|");
      var u = { id: parts[0].trim(), init: 0, hp: 0, max: 0, att: 1, status: [], next: false };
      for (var j = 1; j < parts.length; j++) {
        var f = parts[j].trim();
        var sp = f.indexOf(" ");
        var key = (sp === -1 ? f : f.slice(0, sp)).toLowerCase();
        var val = sp === -1 ? "" : f.slice(sp + 1).trim();
        if (key === "init") u.init = parseInt(val, 10) || 0;
        else if (key === "hp") {
          var m = val.match(/^(\d+)\s*\/\s*(\d+)$/);
          if (m) { u.hp = +m[1]; u.max = +m[2]; } else { var rm = String(val).match(/^(\d+)\s*[-—~]\s*(\d+)$/); if (rm) { u.hp = u.max = Math.round((+rm[1] + (+rm[2])) / 2); } else { u.hp = u.max = parseInt(val, 10) || 0; } }
        }
        else if (key === "att" || key === "attitude") u.att = val === "0" ? 0 : val === "2" ? 2 : 1;
        else if (key === "status") u.status = val.split(/[,，\s]+/).filter(Boolean);
        else if (key === "next") u.next = true;
      }
      if (u.id) units.push(u);
    }
    units.sort(function (a, b) { return b.init - a.init; });
    return units;
  }

  // ---- 敌情简报轻量解析（仅离线降级展示） ----
  function parseEnemyNames(text) {
    var names = [];
    var re = /"(?:名称|name)"\s*:\s*"([^"]{1,40}?)"/g;
    var m;
    while ((m = re.exec(text)) !== null) {
      if (names.indexOf(m[1]) === -1) names.push(m[1]);
    }
    return names;
  }

  function renderFallback(units) {
    fallback.innerHTML = "";
    units.forEach(function (u) {
      var row = document.createElement("div");
      row.className = "bfp-row" + (u.next ? " next" : "");
      var color = ATT_COLORS[String(u.att)];
      var ratio = u.max > 0 ? Math.max(0, u.hp) / u.max : 0;
      var barColor = ratio > 0.5 ? "#5aa84d" : ratio > 0.25 ? "#d8a23a" : "#d84a3f";
      var statusHtml = u.status.map(function (s) {
        return '<span class="bfp-status" title="' + escHtml(s) + '">' + escHtml(STATUS_ICON[s] || "❓") + "</span>";
      }).join("");
      row.innerHTML =
        '<span class="bfp-init" style="color:' + color + '">' + u.init + "</span>" +
        '<span class="bfp-name" style="color:' + color + '">' + escHtml(u.id) + (u.next ? " ▶" : "") + "</span>" +
        '<span class="bfp-hpwrap"><span class="bfp-hptrack"><span class="bfp-hpfill" style="width:' + (ratio * 100).toFixed(0) + "%;background:" + barColor + '"></span></span>' +
        '<span class="bfp-hptext">' + u.hp + "/" + u.max + "</span></span>" + statusHtml;
      fallback.appendChild(row);
    });
    if (units.length === 0) {
      fallback.innerHTML = '<div style="font-size:11px;color:#a89478;padding:4px">（无战斗数据）</div>';
    }
  }

  // ---- 旧面板污染检测：数据岛被 dnnd-battle-panel 二次加工 ----
  if (raw.indexOf('id="raw-data"') !== -1 || raw.indexOf("dnnd-battle-panel") !== -1) {
    warnEl.style.display = "block";
    warnEl.innerHTML = "⚠ 检测到旧版 dnnd-battle-panel 仍在处理本楼数据（数据岛被污染）。请到 酒馆 → 扩展 → Regex，把旧的 <b>dnnd-battle-panel</b> 脚本禁用，然后刷新本楼。";
  }

  var units = parseUnits(raw);
  renderFallback(units);
  var enemyNames = parseEnemyNames(raw);
  var hasEncounter = /<(encounter|statblock)/i.test(raw);
  var hasVars = /<UpdateVariable|<JSONPatch/i.test(raw);
  var hasBattle = /<battle>/i.test(raw);
  if (units.length > 0) {
    badge.textContent = units.length + " 单位 · 轻量模式";
  } else if (hasEncounter && !hasBattle) {
    badge.textContent = "敌情简报 · 轻量模式";
    fallback.innerHTML =
      '<div class="bfp-brief">📋 <b>战前敌情</b> —— 已捕获 ' + enemyNames.length + " 种敌卡：" +
      (enemyNames.length > 0 ? "<b>" + escHtml(enemyNames.slice(0, 8).join("、")) + "</b>" : "（解析中）") +
      "。完整引擎将暂存这些敌卡，待 DM 输出 &lt;battle&gt; 时自动配装开战。</div>";
  } else if (hasEncounter) {
    badge.textContent = units.length + " 单位 · 轻量模式";
  } else if (hasVars) {
    badge.textContent = "变量已捕获 · 轻量模式";
    fallback.innerHTML = '<div style="font-size:11px;color:#a89478;padding:4px">📥 检测到角色变量更新 —— 完整引擎将同步角色名单</div>';
  } else {
    badge.textContent = units.length + " 单位 · 轻量模式";
  }

  // ---- 应用地址配置 ----
  var gear = document.getElementById("bp-gear");
  var cfg = document.getElementById("bp-cfg");
  var cfgInput = document.getElementById("bp-cfg-input");
  var cfgSave = document.getElementById("bp-cfg-save");
  gear.addEventListener("click", function () {
    cfg.style.display = cfg.style.display === "none" || !cfg.style.display ? "block" : "none";
    cfgInput.value = isPlaceholder(APP_URL) ? "" : APP_URL;
  });
  cfgSave.addEventListener("click", function () {
    var v = cfgInput.value.trim();
    try {
      if (v) { localStorage.setItem(LS_KEY, v); } else { localStorage.removeItem(LS_KEY); }
    } catch (e) { /* 沙箱无存储：仅本次生效 */ }
    if (v) { location.reload(); } else { cfg.style.display = "none"; }
  });

  // ---- 加载完整应用 ----
  if (isPlaceholder(APP_URL)) {
    hint.innerHTML = '⚠ 尚未配置应用地址 —— 点击右上角 <b>⚙ 应用地址</b> 填入你的 GitHub Pages 地址，或编辑正则脚本中的 APP_URL。当前为离线轻量面板。';
    return;
  }

  var ready = false;
  var t = null;

  // [流式守卫] 生成进行中不注入跨域 iframe：本正则在流式渲染中途匹配到战斗块时，
  // 立即创建 iframe 会中断 ST 的生成流（9-18/9-19 实测战斗回复全部在 </encounter> 后 1-3 chunk 处断流）。
  // 轮询等待生成结束后再加载完整引擎；流式期间保持下方轻量渲染，不受影响。
  // 关键：本脚本运行在沙箱 iframe 内，document.getElementById 只能看到面板自身文档，
  // 查不到主界面的 #mes_stop——必须穿透 window.parent 到酒馆主文档读真实生成状态。
  var PROBE_OK = false; // whether the host document is reachable
  function isGeneratingNow() {
    var docs = [];
    try { if (window.parent && window.parent.document) { docs.push(window.parent.document); PROBE_OK = true; } } catch (e) {}
    try { if (window.top && window.top.document && docs.indexOf(window.top.document) === -1) { docs.push(window.top.document); PROBE_OK = true; } } catch (e) {}
    if (!PROBE_OK) return true; // 洞3：探测不可达时保守视为生成中，走短兜底
    docs.push(document);
    for (var i = 0; i < docs.length; i++) {
      try {
        var stopBtn = docs[i].getElementById("mes_stop");
        if (stopBtn && (stopBtn.offsetParent !== null || (stopBtn.getClientRects && stopBtn.getClientRects().length > 0))) return true;
      } catch (e) {}
    }
    return false;
  }
  var engineLoadStarted = false;
  var engineWaitStart = 0;
  var forceLoad = false; // 用户手动放行：点击立即加载后跳过守卫
  function noteWaiting() {
    try {
      var secs = Math.round((Date.now() - engineWaitStart) / 1000);
      badge.textContent = "生成中 · 暂缓加载 " + secs + "s";
      if (Date.now() - engineWaitStart >= 8000) {
        hint.innerHTML = '⏳ 检测到酒馆仍在生成，引擎暂缓注入（已等待 ' + secs + ' 秒）。若回复其实已完成，<a href="javascript:void(0)" id="bp-force">点此立即加载引擎</a>';
        var fl = document.getElementById("bp-force");
        if (fl && !fl._bfpBound) { fl._bfpBound = true; fl.addEventListener("click", function () { forceLoad = true; engineLoadStarted = false; tryLoadEngine(); }); }
      }
    } catch (e) {}
  }
  function tryLoadEngine() {
    if (engineLoadStarted) return;
    if (isGeneratingNow() && !forceLoad) {
      if (!engineWaitStart) engineWaitStart = Date.now();
      noteWaiting();
      if (Date.now() - engineWaitStart < (PROBE_OK ? 300000 : 20000)) { window.setTimeout(tryLoadEngine, 600); return; }
    }
    engineLoadStarted = true;
    try { t = window.setTimeout(onTimeout, TIMEOUT_MS); } catch (e) {}
    frame.src = APP_URL + (APP_URL.indexOf("?") === -1 ? "?" : "&") + "embed=1";
  }

  function send() {
    try {
      frame.contentWindow.postMessage({ type: "bp:battle", payload: raw, depth: DEPTH, ts: Date.now() }, "*");
    } catch (e) {}
  }

  frame.addEventListener("load", function () { send(); });

  window.addEventListener("message", function (ev) {
    var msg = ev.data;
    if (!msg || typeof msg !== "object") return;
    if (msg.type === "bp:ready" && !ready) {
      ready = true;
      frame.style.display = "block";
      fallback.style.display = "none";
      badge.textContent = units.length + " 单位 · 完整引擎";
      if (hint) hint.style.display = "none";
      send();
      if (t) window.clearTimeout(t);
    }
    if (msg.type === "bp:height" && ready) {
      var h = Math.max(320, Math.min(4000, msg.height || 600));
      frame.style.height = h + "px";
      document.body.style.height = h + "px";
    }
    if (msg.type === "bp:report" && typeof msg.text === "string") {
      deliverReport(msg.text);
    }
  });

  // ---- 战报自动回注：把面板生成的 <battleresult> 作为玩家消息送回对话，替代手动粘贴 ----
  function escSlash(s) {
    return String(s == null ? "" : s)
      .replace(/\\/g, "\\\\").replace(/\r?\n/g, " ").replace(/\|/g, "｜").replace(/"/g, '\\"');
  }
  function deliverReport(text) {
    var body = String(text || "").trim();
    if (!body) return;
    if (typeof triggerSlash === "function") {
      try {
        triggerSlash("/send " + escSlash(body) + "|/trigger");
        badge.textContent = "战报已送回对话";
        return;
      } catch (e) { /* 落到下方提示 */ }
    }
    if (warnEl) {
      warnEl.style.display = "block";
      warnEl.innerHTML = "⚠ 没能自动把战报送回对话（未检测到酒馆命令接口）。请在面板内点「复制战报给 DM」手动粘贴。";
    }
  }

  function onTimeout() {
    if (!ready) {
      if (hint) hint.innerHTML = '⚠ 完整引擎连接超时（GitHub Pages 不可达？），当前为离线轻量面板。可 <a href="' + APP_URL + '" target="_blank">点此打开完整界面</a> 排查。';
    }
  }

  tryLoadEngine();
  })();
} catch (e) { try { document.getElementById("bp-badge").textContent = "⚠ 面板脚本异常: " + e.message; } catch (_e) {} }
</script>
</body>
</html>
