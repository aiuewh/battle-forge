<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>图标风格预览</title>
<style>
  body { background: #14100c; color: #c9c2b4; font-family: system-ui; padding: 24px; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 20px; max-width: 1100px; }
  .cell { background: #1e1812; border: 1px solid #3a3228; border-radius: 12px; padding: 16px; text-align: center; }
  .cell img { width: 150px; height: 150px; }
  .cell div { font-size: 13px; margin-top: 8px; }
  h2 { color: #d8b87c; }
</style>
</head>
<body>
<h2>图标设计稿（3 旧 + 7 新）</h2>
<div class="grid">
  <div class="cell"><img src="大龙.svg?v=7"><div>龙类（旧）</div></div>
  <div class="cell"><img src="小龙.svg?v=7"><div>飞龙（旧）</div></div>
  <div class="cell"><img src="恶魔.svg?v=7"><div>恶魔（旧）</div></div>
  <div class="cell"><img src="亡灵.svg?v=7"><div>亡灵（新）</div></div>
  <div class="cell"><img src="精怪.svg?v=7"><div>精怪（新）</div></div>
  <div class="cell"><img src="邪信徒.svg?v=7"><div>邪信徒（新）</div></div>
  <div class="cell"><img src="野兽.svg?v=7"><div>野兽（新）</div></div>
  <div class="cell"><img src="构装体.svg?v=7"><div>构装体（新）</div></div>
  <div class="cell"><img src="人形.svg?v=7"><div>人形（新）</div></div>
  <div class="cell"><img src="未知.svg?v=7"><div>未知（新）</div></div>
  <div class="cell"><img src="兽人.svg?v=7"><div>兽人（新）</div></div>
  <div class="cell"><img src="哥布林.svg?v=7"><div>哥布林（新）</div></div>
</div>
</body>
</html>
